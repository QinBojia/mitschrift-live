<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>随堂字幕 Mitschrift Live</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display: grid; grid-template-rows: auto auto 1fr auto; height: 100vh; overflow: hidden; }

  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 18px;
    border-bottom: 1px solid var(--line); background: var(--bg-elev);
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; margin-right: 6px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-3); }
  .brand .dot.live { background: var(--err); box-shadow: 0 0 0 0 rgba(255,107,107,.6); animation: pulse 1.6s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(255,107,107,0); } 100% { box-shadow: 0 0 0 0 rgba(255,107,107,0); } }
  .spacer { flex: 1; }
  .label { color: var(--text-3); font-size: 12px; }

  .status {
    display: flex; align-items: center; gap: 18px; padding: 8px 18px; font-size: 12px;
    color: var(--text-2); border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .src { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .src .dev { max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-3); }
  /* each side is a switch: click to stop / resume listening to it */
  .src[role=button] { cursor: pointer; padding: 3px 8px; margin: -3px -8px; border-radius: 8px; user-select: none; }
  .src[role=button]:hover { background: color-mix(in srgb, var(--text-3) 16%, transparent); }
  .src.off .who { opacity: .5; text-decoration: line-through; }
  .src.off .dev { opacity: .6; }
  .src.off .meter { visibility: hidden; }
  .stats { margin-left: auto; display: flex; gap: 12px; color: var(--text-3); }
  .stats b { color: var(--text-2); font-weight: 600; }
  .error { color: var(--err); font-weight: 600; }

  main { overflow-y: auto; padding: 8px 22px 40px; scroll-behavior: smooth; position: relative; }

  /* chat layout: 对方 on the left, 我 on the right; consecutive lines of one speaker are grouped */
  .entry { display: flex; flex-direction: column; align-items: flex-start; margin-top: 16px; }
  .entry.me { align-items: flex-end; }
  .entry.cont { margin-top: 5px; }
  .entry.cont .meta { display: none; }
  .meta { display: flex; gap: 7px; align-items: center; margin: 0 8px 5px; font-size: 11px; color: var(--text-3); }
  .entry.me .meta { flex-direction: row-reverse; }
  .meta .t { font-variant-numeric: tabular-nums; }
  .bubble {
    max-width: min(78%, 780px); padding: 9px 15px 11px; border-radius: 18px;
    background: var(--bubble-other); border: 1px solid var(--line);
    transition: border-color .2s, background .2s;
  }
  .entry.other .bubble { border-top-left-radius: 6px; }
  .entry.me .bubble { background: var(--bubble-me); border-color: var(--bubble-me-line); border-top-right-radius: 6px; }
  .entry.other.cont .bubble { border-top-left-radius: 18px; border-bottom-left-radius: 6px; }
  .entry.me.cont .bubble { border-top-right-radius: 18px; border-bottom-right-radius: 6px; }
  .entry.live .bubble { border-style: dashed; }
  /* original first and larger; translation a bit smaller in a subtitle tint */
  .orig { color: var(--text); font-size: 16px; line-height: 1.5; font-weight: 500; }
  .trans { color: var(--trans); font-size: 16px; line-height: 1.5; font-weight: 500; margin-top: 3px; }
  mark { background: color-mix(in srgb, var(--warn) 45%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
  .empty { color: var(--text-3); text-align: center; margin-top: 18vh; line-height: 1.9; }

  #jump {
    position: fixed; right: 26px; bottom: 74px; display: none; border-radius: 999px;
    background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }

  footer {
    display: flex; gap: 10px; align-items: center; padding: 10px 18px;
    border-top: 1px solid var(--line); background: var(--bg-elev);
  }
  footer input { flex: 1; max-width: 360px; }
  footer .count { color: var(--text-3); font-size: 12px; margin-left: auto; }

  /* settings drawer */
  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 360px; max-width: 100vw;
    background: var(--bg-elev); border-left: 1px solid var(--line); padding: 18px 20px; overflow-y: auto;
    transform: translateX(100%); transition: transform .22s ease; z-index: 10; box-shadow: -12px 0 30px rgba(0,0,0,.3);
  }
  #drawer.open { transform: none; }
  #drawer h2 { font-size: 16px; margin: 0 0 14px; display: flex; justify-content: space-between; align-items: center; }
  #drawer h3 { font-size: 12px; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; margin: 20px 0 8px; }
  .field { display: grid; gap: 6px; margin-bottom: 12px; }
  .field > span { font-size: 12px; color: var(--text-2); }
  .field select, .field input { width: 100%; }
  .toggle { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; }
  .switch { width: 36px; height: 20px; border-radius: 10px; background: var(--line); position: relative; cursor: pointer; border: 0; padding: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch.on { background: var(--accent); }
  .switch.on::after { left: 19px; }
  .hint { font-size: 11.5px; color: var(--text-3); line-height: 1.5; margin-top: -4px; }
  .boot {
    position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 20; max-width: 520px;
    background: var(--bg-elev); border: 1px solid var(--warn); border-radius: var(--radius);
    padding: 18px 22px; line-height: 1.8; box-shadow: 0 12px 40px rgba(0,0,0,.4);
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #rec { color: var(--text-2); }
  #rec.armed { color: var(--err); border-color: color-mix(in srgb, var(--err) 55%, var(--line)); }
  #rec.live { color: #fff; background: var(--err); border-color: var(--err); animation: recpulse 1.6s infinite; }
  #rec.live.paused { animation: none; background: color-mix(in srgb, var(--err) 55%, transparent); }
  @keyframes recpulse { 50% { background: color-mix(in srgb, var(--err) 70%, transparent); } }
  .notice { color: var(--accent); }
  .keyrow { display: flex; gap: 6px; }
  .keyrow input { flex: 1; min-width: 0; font-family: ui-monospace, Consolas, monospace; }
  .keystatus { margin-top: -6px; margin-bottom: 12px; }
  .keystatus.none { color: var(--warn); }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot" id="dot"></span><span data-i18n="app">随堂字幕</span></div>
  <button id="run" class="primary" data-i18n="run.start">开始</button>
  <button id="rec" data-i18n="rec" data-i18n-title="rec.title">● 录音</button>
  <span class="spacer"></span>
  <span class="label" data-i18n="target">译文</span>
  <div class="seg" id="target" data-i18n-title="target.title">
    <button data-v="zh">中文</button><button data-v="en">English</button><button data-v="de">Deutsch</button><button data-v="off" data-i18n="target.off">关</button>
  </div>
  <button id="overlayBtn" data-i18n="overlay" data-i18n-title="overlay.title">悬浮字幕</button>
  <button id="gear" class="icon" data-i18n-title="settings">⚙</button>
</header>

<div class="status">
  <div class="src" id="src-other" role="button" tabindex="0" data-i18n-title="src.title"><span class="who other" data-i18n="who.other">对方</span><div class="meter other"><i id="lv-other"></i></div><span class="dev" id="dev-other"></span></div>
  <div class="src" id="src-me" role="button" tabindex="0" data-i18n-title="src.title"><span class="who me" id="who-me" data-i18n="who.me">我</span><div class="meter me"><i id="lv-me"></i></div><span class="dev" id="dev-me"></span></div>
  <div class="stats" id="stats"></div>
</div>

<main id="list">
  <div class="empty" id="empty" data-i18n-html="empty">还没有字幕。</div>
</main>
<button id="jump" data-i18n="jump">↓ 回到最新</button>

<footer>
  <input id="search" data-i18n-ph="search" spellcheck="false">
  <button data-export="txt" data-i18n="export.txt">导出 TXT</button>
  <button data-export="srt">SRT</button>
  <button data-export="md">Markdown</button>
  <button id="clear" data-i18n="clear" data-i18n-title="clear.title">清空</button>
  <button id="openRec" hidden data-i18n="openRec" data-i18n-title="openRec.title">打开录音文件夹</button>
  <span class="count" id="count"></span>
</footer>

<aside id="drawer">
  <h2><span data-i18n="settings">设置</span> <button class="icon" id="closeDrawer">✕</button></h2>
  <h3 data-i18n="sec.ui">界面</h3>
  <label class="field"><span data-i18n="ui.lang">界面语言</span>
    <select id="set-ui_lang"><option value="auto" data-i18n="ui.auto">自动</option><option value="zh">中文</option><option value="en">English</option></select></label>
  <h3 data-i18n="sec.audio">音频</h3>
  <label class="field"><span data-i18n="dev.other">对方（系统声音）</span><select id="set-speaker"></select></label>
  <label class="field"><span data-i18n="dev.me">我（麦克风）</span><select id="set-mic"></select></label>
  <div class="toggle"><span data-i18n="aec">回声消除</span><button class="switch on" data-k="aec"></button></div>
  <h3 data-i18n="sec.rec">录音</h3>
  <label class="field"><span data-i18n="rec.dir">保存位置</span>
    <span class="keyrow"><input id="rec-dir" readonly spellcheck="false"><button id="rec-dir-pick" data-i18n="rec.dir.pick">选择…</button><button id="rec-dir-reset" hidden data-i18n="rec.dir.reset">恢复默认</button></span></label>
  <p class="hint" data-i18n="rec.dir.hint"></p>
  <h3 data-i18n="sec.asr">识别</h3>
  <label class="field"><span data-i18n="engine">引擎</span>
    <select id="set-engine"><option value="cuda" data-i18n="engine.cuda"></option><option value="npu" data-i18n="engine.npu"></option><option value="dml" data-i18n="engine.dml"></option><option value="cpu" data-i18n="engine.cpu"></option></select></label>
  <div class="toggle"><span data-i18n="zh">识别中文</span><button class="switch on" data-k="zh"></button></div>
  <h3 data-i18n="sec.mt">翻译</h3>
  <label class="field"><span data-i18n="model">模型</span>
    <select id="set-model"><option value="deepseek-flash">deepseek-flash</option><option value="claude-haiku-5-5">Claude Haiku 5.5</option><option value="claude-opus-5-5">Claude Opus 5.5</option><option value="azure-translator" data-i18n="model.azure">Microsoft Translator</option></select></label>
  <div class="keybox" data-provider="deepseek">
    <label class="field"><span data-i18n="key.deepseek">DeepSeek API key</span>
      <span class="keyrow"><input type="password" autocomplete="off" spellcheck="false" data-i18n-ph="key.ph"><button class="keysave" data-i18n="key.save">保存</button><button class="keyclear" hidden data-i18n="key.clear">删除</button></span></label>
    <p class="hint keystatus"></p>
  </div>
  <div class="keybox" data-provider="anthropic">
    <label class="field"><span data-i18n="key.anthropic">Claude API key</span>
      <span class="keyrow"><input type="password" autocomplete="off" spellcheck="false" data-i18n-ph="key.ph"><button class="keysave" data-i18n="key.save">保存</button><button class="keyclear" hidden data-i18n="key.clear">删除</button></span></label>
    <p class="hint keystatus"></p>
  </div>
  <div class="keybox" data-provider="azure">
    <label class="field"><span data-i18n="key.azure">Microsoft Translator key</span>
      <span class="keyrow"><input type="password" autocomplete="off" spellcheck="false" data-i18n-ph="key.ph.azure"><button class="keysave" data-i18n="key.save">保存</button><button class="keyclear" hidden data-i18n="key.clear">删除</button></span></label>
    <p class="hint keystatus"></p>
    <label class="field"><span data-i18n="key.region">区域</span><input id="set-azure_region" spellcheck="false" data-i18n-ph="key.region.ph"></label>
  </div>
  <label class="field"><span data-i18n="scene">场景</span><input id="set-scene" value="a German language class"></label>
  <p class="hint" data-i18n="scene.hint"></p>
  <h3 data-i18n="sec.bar">悬浮字幕</h3>
  <label class="field"><span data-i18n="bar.show">显示内容</span>
    <select id="set-bar-show"><option value="both" data-i18n="bar.show.both"></option><option value="original" data-i18n="bar.show.original"></option><option value="translation" data-i18n="bar.show.translation"></option></select></label>
  <p class="hint" data-i18n="bar.show.hint"></p>
  <label class="field"><span data-i18n="bar.font">字号</span><input id="set-font" type="range" min="12" max="40" value="20"></label>
  <label class="field"><span data-i18n="bar.text">文字不透明度</span><input id="set-text-alpha" type="range" min="20" max="100" value="100"></label>
  <label class="field"><span data-i18n="bar.unsure">未确定文字的亮度</span><input id="set-unsure" type="range" min="20" max="100" value="55"></label>
  <p class="hint" data-i18n="bar.unsure.hint"></p>
  <label class="field"><span data-i18n="bar.bg">背景不透明度</span><input id="set-bg-alpha" type="range" min="0" max="100" value="100"></label>
  <p class="hint" data-i18n="bar.hint"></p>
  <div class="toggle"><span><span data-i18n="lock">鼠标穿透</span><span class="hk" id="hk"></span></span><button class="switch" data-k="clickThrough"></button></div>
  <p class="hint" id="hk-hint" ></p>
  <h3 data-i18n="sec.about">关于</h3>
  <p class="hint" id="about"></p>
  <p class="hint" data-i18n="credits"></p>
</aside>

<div id="boot" class="boot" hidden>
  界面脚本没有加载：直接打开 HTML 文件时浏览器会拦截脚本。请用 <b>ui.bat</b> 启动桌面版。<br>
  The page scripts did not load: browsers block them for HTML files opened directly. Start the app with <b>ui.bat</b>.
</div>
<script>
  // module scripts are blocked on file:// - say so instead of leaving dead buttons. Served by the
  // app the scripts can take several seconds while the same process loads the speech models, so
  // there the note waits much longer, and main.js hides it again once it runs.
  if (location.protocol === "file:") document.getElementById("boot").hidden = false;
  else setTimeout(() => { if (!window.__lcReady) document.getElementById("boot").hidden = false; }, 15000);
</script>
<script type="module" src="main.js"></script>
</body>
</html>
